<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Gestor de tareas escolares</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <h1>Gestor de tareas escolares</h1>
    <p>Anota qué hay que entregar, de qué materia es y para cuándo.</p>

    <form id="form-tarea">
      <input id="titulo" type="text" placeholder="Título de la tarea" required>
      <input id="materia" type="text" placeholder="Materia" required>
      <input id="fecha" type="date" required>
      <button type="submit">Agregar tarea</button>
    </form>

    <ul id="lista-tareas"></ul>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
